# Include in the existing lancoai.site HTTPS server block.
location = /duo {
    absolute_redirect off;
    return 308 /duo/;
}

location ^~ /duo/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $duo_connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 2m; # Authenticated photo upload; JSON requests remain capped at 16KiB by the app.

    limit_req zone=duo_requests burst=80 nodelay;
    limit_conn duo_connections 100;
    limit_req_status 429;
    limit_conn_status 429;

    # Defining headers here replaces the parent header list. The app supplies
    # its own CSP, nosniff and referrer policy for HTML/assets. Do not combine
    # the panel's CSP with it: the game uses blob images and WebSockets.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    access_log /var/log/nginx/duo-games.access.log duo_access;
    error_log /var/log/nginx/duo-games.error.log warn;
}
