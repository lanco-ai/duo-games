# Install in /etc/nginx/conf.d/duo-games.conf (http context).
map $http_upgrade $duo_connection_upgrade {
    default upgrade;
    '' close;
}

# Separate limits from the existing shop/network/workbench services.
limit_req_zone $binary_remote_addr zone=duo_requests:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=duo_connections:1m;
log_format duo_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
